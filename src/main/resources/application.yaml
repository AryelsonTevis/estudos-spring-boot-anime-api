server:
  error:
    include-stacktrace: never

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: estudos-spring-boot
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus
application.properties: springdoc.show-actuator=true, management.metrics.application=${spring.application.name}
